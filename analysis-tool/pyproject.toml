[project]
name = "election-forensics"
version = "0.1.0"
description = "Статистические методы обнаружения фальсификаций на выборах (метод Шпилькина и др.)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.scripts]
ef-analyze = "election_forensics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/election_forensics"]

[dependency-groups]
dev = ["pytest>=8.0"]
