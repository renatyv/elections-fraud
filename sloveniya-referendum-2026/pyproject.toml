[project]
name = "slovenia-referendum-2026"
version = "0.1.0"
description = "Мониторинг и анализ данных четырёх референдумов Словении 11 октября 2026 года (источник: DVK, volitve.dvk-rs.si)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "python-docx>=1.2.0",
]

[project.scripts]
sloref = "sloref.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sloref"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
